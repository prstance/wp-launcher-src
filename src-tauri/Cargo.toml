[package]
name = "wp-launcher"
version = "0.6.4"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "process", "macros", "net", "io-util"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
base64 = "0.23"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
roxmltree = "0.21.2"
png = "0.18"
qbsdiff = "1.4.4"
sha2 = "0.11.1"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
qrcode = { version = "0.15.0", default-features = false }
getrandom = "0.3"
time = { version = "0.3", features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd", "l2cap"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Devices_Bluetooth",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Devices_Properties",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Threading",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2.14.1"
