[package]
name = "wp-launcher"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "process", "macros", "net", "io-util"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
base64 = "0.23"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
roxmltree = "0.21.2"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd", "l2cap"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.7.0"
